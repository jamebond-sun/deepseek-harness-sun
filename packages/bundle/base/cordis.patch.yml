# dsh-base bundle 补丁：每个基于 base 的 profile 所共享的核心，作为一次 insert 应用在
# 空的 profile 根之上。后续 bundle 补丁与用户的 profile cordis.patch.yml 按 id 定位这些
# 行，每行以最后一次写入为准。
#
# 补丁是替换目标行的整个 `config`，而不是合并进去，因此取值随模式不同的行不会放在
# 这里：它属于各自的模式 bundle，从而让任何单行都只存在于一层 bundle 加上用户层。
# 下面出现的模式相关行采用共享的插件身份与中立默认值；每个模式 bundle 会重申其完整
# 配置。
#
# 行的顺序不承载加载语义（激活由服务可用性驱动）；这里的分组只是为了便于阅读。

- insert:
    - id: tool-plugin-manager
      name: '@deepseek-ai/dsh-plugin-manager/tools'
      disabled: true

    - id: plugin-manager
      name: '@deepseek-ai/dsh-plugin-manager'
      disabled: !!js "!ctx.get('profileContext')"

    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    # profile 配置默认重载；模块根目录需要显式启用。
    - id: hmr
      name: '@deepseek-ai/dsh-hmr'
      disabled: !!js "!ctx.get('profileContext')"
      config:
        root: []

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: deepseek-llm-api-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-log-deepseek
      name: '@deepseek-ai/dsh-session-log-deepseek'

    - id: typert
      name: '@deepseek-ai/dsh-typert-registry'

    - id: typert-loader
      name: '@deepseek-ai/dsh-typert-loader'

    - id: typert-gateway
      name: '@deepseek-ai/dsh-api-gateway'

    # 面向非所有者 Peer 的方法级访问控制；Gateway 依赖它，其 Client 半部分发布标准
    # 的访问 Hook。
    - id: remote-access
      name: '@deepseek-ai/dsh-api-remote-access'

    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        # 这是防止输出失控的上限，而非长度目标：提示词本身已经让标题保持简短，而
        # 模型无法关闭的思考过程同样计入输出。该值处于常见模型输出限制之内。
        maxOutputTokens: 4096
        timeoutMs: 60000

    - id: user-questions
      name: '@deepseek-ai/dsh-user-questions'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: plugin-package-inventory-deepseek
      name: '@deepseek-ai/dsh-plugin-package-inventory-deepseek'

    # 由入口点创建的 Agent 所采用的、与传输方式无关的默认值。Settings 可以提供已保存
    # 的选择；消费者在创建时读取它。
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-flash

    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    # 实时的 Config 表单通过生效中的 profile 补丁持久化。

    # 实时配置表单通过启动器的 profile 持久化。
    - id: config-editor
      name: '@deepseek-ai/dsh-config-editor'
      disabled: !!js "!ctx.get('profileContext')"

    - id: settings
      name: '@deepseek-ai/dsh-settings'
      disabled: !!js "!ctx.get('profileContext')"

    # 凭据来源：受管的 `$DSH_HOME/.credentials.yaml`，然后依次回退到继承的环境变量、
    # 项目 `.env` 与用户 `.env`。适配器按请求解析引用；Models 页面只写入那份受管文档，
    # 它从不被展开写入进程环境。
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: deepseek-account
      name: '@deepseek-ai/dsh-deepseek-account-platform'
      config:
        desktopPlatform: !!js "ctx.get('profileContext')?.name === 'desktop' && ['darwin', 'win32'].includes(process.platform) ? process.platform : null"

    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'

    # pi-ai 多 provider 孪生行，以休眠状态挂载：在 `llm-pi-ai:` 设置段落提供 provider
    # 配置之前，它注册零个路由（选择器里也不会多出模型）——一旦提供，这些路由即时注册，
    # 密钥按请求通过其 apiKeyEnv 引用解析，并在该段落被清空时再次注销。提供这些配置
    # 正是 Web 端 Models 页面所做的事。存在哪些适配器属于组成问题；运行哪些 provider
    # 则由用户的设置文档决定。
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'

    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')

    # 持久化的图片字节存放在只追加的 session 日志之外。消息保留内容寻址的引用，由这个
    # 共享后端为 provider 请求与已授权的历史读取解析它们。
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'

    # 全文 session 搜索需要显式启用。`openAt: never` 让 ctx.sessionQuery 保持挂载——
    # 精确读取、标题与血缘追溯（session 导出、subagent-fork 的 Workspace 继承）仍然
    # 可用——而搜索调用会以 SESSION_QUERY_SEARCH_DISABLED 失败，SQLite 也不会被打开；
    # Web 侧边栏搜索只匹配标题与 workspace 名称。启用内容搜索的部署在更后面的补丁层
    # （profile cordis.patch.yml 或 --patch 覆盖）把 `openAt` 改写为 `first-search`
    # 或 `startup`，通常还会配一个持久化的 `path`。
    - id: session-query-sqlite
      name: '@deepseek-ai/dsh-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # 共享的投影注册表：subagent 目录身份（模式/标签）经由它注册的单位折叠而来，
    # 因此下面的 `list_agents` 界面缺少它时会显式失败；web 层复用同一挂载来获取列表行。
    - id: working-directory
      name: '@deepseek-ai/dsh-working-directory'

    - id: tool-working-directory
      name: '@deepseek-ai/dsh-tool-working-directory'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    # 持久化 KV 存储：存储中枢、json 后端，以及构建在它们之上的、经过 schema 校验的
    # 领域形态。会话层的持久化（下面的投影缓存；web 层的 workspace）都经由这套栈，
    # 因此它属于共享的 base。
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    # 持久化的投影缓存：在 session_projcache 领域之上做节流后写（按记录布局——每个
    # session 一份带版本戳的检查点文档），服务于 session 列表的投影列。
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: otel
      name: '@deepseek-ai/dsh-otel'

    # OTel 只在收到明确的用户反馈之后才释放一段 Session 日志前缀，与模型 provider 无关。
    # 日常活动从不触发采集。DSH_TELEMETRY_OTLP_URL 可覆盖生产端点。非空的
    # DSH_TELEMETRY_DISABLED——任何取值，包括 '0'/'false'——都让本进程退出遥测
    # （启动器是把该行改写为 disabled；配置本身无法停用一行）。导出数据携带 harness
    # 主目录的匿名用户 id（$DSH_HOME/.anonymous-user-id，随机 UUID；删除该文件即可重置
    # 身份）作为 Resource 的 user.id。按字节计量的批处理可能把一段已授权前缀拆成多次
    # HTTP 请求。请求串行执行；每个请求各有 1s 的传输超时与 1.5s 的看门狗。看门狗不会
    # 释放当前占用的请求槽位。外层 3s 的关闭截止时间会停止排队中的发送；较大的前缀或
    # 未完成的传输可能留下未发送的记录。每条 CLI 退出路径都会在 SIGINT/SIGTERM 时通过
    # dispose 根节点来排空。
    - id: session-telemetry-otel
      name: '@deepseek-ai/dsh-session-telemetry-otel'
      config:
        mode: !!js process.env.DSH_TELEMETRY_MODE || 'FEEDBACK_ONLY'
        shutdownTimeoutMillis: 3000
        maxRequestBytes: 4000000
        exporter:
          url: !!js process.env.DSH_TELEMETRY_OTLP_URL ?? 'https://dsh-otel-collector.deepseeksvc.com/v1/logs'
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'

    # 每种已发布的 CLI 模式都从同一条文件副作用边界开始。环境变量仍然是显式的部署
    # 覆盖手段；除此之外，新建会话通过下面的权限服务固定为 workspace-write + ask。
    - id: sandbox
      name: '@deepseek-ai/dsh-sandbox-local'

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@deepseek-ai/dsh-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@deepseek-ai/dsh-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@deepseek-ai/dsh-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@deepseek-ai/dsh-shell-env'

    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@deepseek-ai/dsh-tool-jobs'

    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: '@deepseek-ai/dsh-skill'

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

    - id: commands
      name: '@deepseek-ai/dsh-commands'

    - id: command-feedback
      name: '@deepseek-ai/dsh-command-feedback'

    - id: goal
      name: '@deepseek-ai/dsh-goal'

    - id: goal-round-driver
      name: '@deepseek-ai/dsh-goal-round-driver'

    - id: command-goal
      name: '@deepseek-ai/dsh-command-goal'

    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    # 人工的 `/compact`：在自动阈值之下再做一次有效精简。它与后端无关，因此跟随本
    # 叶子挂载的那个压缩服务。
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: subagent
      name: '@deepseek-ai/dsh-subagent'

    - id: subagent-spawn-in-process
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@deepseek-ai/dsh-subagent-fork-in-process'
      config:
        providerName: fork

    # 可续跑的后台子代理按各自的委派工具选择。单独加载的 follow-up 工具注册唯一的
    # 全局 `send_message`。
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent

    # fork 省略模型选择，这样 provider/model 与父级保持一致，继承来的历史也仍然具备
    # KV Cache 复用的资格。父级与子级共享消息类工具；返回指引跟随所继承的历史。
    # 参见 .agents/notes/implemented/feature/2026-08-18-model-selected-subagent-routes.md
    # 与 .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md。
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork

    - id: ptc-runtime
      name: '@deepseek-ai/dsh-ptc-runtime-node'

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: timeout-policy
      name: '@deepseek-ai/dsh-tool-call-timeout-policy'

    - id: spill-local
      name: '@deepseek-ai/dsh-spill-local'

    - id: spill-policy
      name: '@deepseek-ai/dsh-spill-policy'
      config:
        maxInlineTokens: 12500

    # 在每次模型请求与顶层派发之前做持久化检查点。
    - id: session-checkpoint-policy
      name: '@deepseek-ai/dsh-session-checkpoint-policy'

    # 在更宏观的会话压缩器运行之前先压缩过大的工具结果，把模型可见的结果保持在
    # 配置预算之内。
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    # 当支持图片的路由以超出图片预算为由拒绝请求时，把界面上最旧的图片替换为占位符
    # 并重试。
    - id: image-offload
      name: '@deepseek-ai/dsh-compaction-image-offload'

    - id: tool-todo
      name: '@deepseek-ai/dsh-tool-todo'
      config:
        allowParallelInProgress: true

    # 持久化的同会话目标在这里抵达模型与斜杠菜单；其领域、驱动器与 `/goal` 命令在
    # 上方。
    - id: tool-goal
      name: '@deepseek-ai/dsh-tool-goal'

    # 工具链上的连续重复提醒。
    - id: repeat-tool-reminder
      name: '@deepseek-ai/dsh-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # 共享的 base 启用稳定的、面向模型的 web_search 与 web_fetch 工具。Web 应用会停用
    # 这个宿主行，并按每个 agent preset 组装这两个工具；网络策略更严格的产品可以覆盖
    # tool-web。DeepSeek 搜索在每次搜索时解析 Models 页面为聊天所管理的同一个
    # DEEPSEEK_API_KEY 凭据；它的 Messages 端点独立于模型路由配置，因此有自己的
    # base-URL 覆盖。匿名抓取只接受公开的 HTTP(S) 目标，会解析并校验每个目标，并固定
    # 每次真实连接。搜索是一次带服务端检索的完整辅助模型请求，因此这条已发布的
    # DeepSeek 路由获得 60s，而 provider 中立的工具默认值仍是 30s。DeepSeek Search 与
    # Fetch API 以同一凭据分别注册为 deepseek-search-api 与 deepseek-fetch-api；Web 的
    # 搜索设置开关会在这些默认值之外选中这两个。
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: deepseek-official
        fetchProvider: http

    - id: web-search-deepseek
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-deepseek-api
      name: '@deepseek-ai/dsh-web-deepseek-api'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000

    - id: mcp-resources
      name: '@deepseek-ai/dsh-mcp-resources'

    # ── 每种模式都会挂载、但其取值可由各覆盖层给出的行 ──────────────────────────

    # 工具注册表。呈现模式属于部署选择；这里省略它以保留 schema 默认值（native）。
    - id: tools
      name: '@deepseek-ai/dsh-tools'

    # 部署人格属于部署选择；plan-mode 与工具插件各自拥有自己的提示词段落。
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        personaPrefix: ''

    # 启动时创建的 Agent。base 保持为空；原始覆盖层可以创建 agent，而 Web 按客户端
    # 请求创建 session。
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    # 沙箱化的文件系统提供者。`cwd` 默认为 `process.cwd()`；覆盖层可以固定另一个
    # workspace。
    - id: fs-sandbox
      name: '@deepseek-ai/dsh-fs-sandbox'

    # 原生的 DeepSeek 适配器。没有内联任何密钥或端点：二者都按请求从该条目之上的
    # `llm-deepseek:` 设置段落解析，密钥来自下面的凭据存储。思考相关的默认值属于
    # 部署选择。
    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'

    - id: llm-deepseek-account
      name: '@deepseek-ai/dsh-llm-deepseek-account'
