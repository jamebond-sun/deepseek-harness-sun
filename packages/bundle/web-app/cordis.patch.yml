# dsh-web-app bundle 补丁：位于 dsh-base 层之上的浏览器界面。它在 dsh-base 的 insert
# 之后应用；此处的行按 id 覆盖 base 的行，而 profile 自身的 cordis.patch.yml 与任何
# --patch 覆盖层仍在它之后。
#
# 补丁会替换目标行的整个 `config`，因此下面的每一行都会重申它自己拥有的每个键。
#
# web-startup 插件注入 `cmdlineArgs`，并把 `webStartup` 作为一个普通的 Cordis 服务提供
# 出来。由标志配置的行注入该服务，因此 Loader 只在它存在之后才解析它们的表达式。
# web-runtime 行校验所宣告的公开 URL；Connection 直接从 `webStartup` 读取本次调用的
# authority 列表。`dsh --profile web --help` 不提供 `webStartup`，因此不会绑定服务器。

# ── base 有意省略的、界面特有的取值 ─────────────────────────────────────────

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# 全文 session 搜索需要显式启用（base 行的 `openAt: never`）。这次重申让 Web 的取值
# 落在一个临时的内存索引上；启用内容搜索的部署在更后面的补丁层把 `openAt` 改写为
# `first-search`，从而把 node:sqlite 的导入与内存句柄推迟到第一次搜索，使 Node 22
# 的启动保持安静。
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    # 临时方案：在每个会话的工具呈现方式选择尚未设计完成之前，DSH_TOOLS_MODE
    # （native|ptc）让整个 dsh 进程进入 PTC 模式；不设置则保留 schema 默认值（native）。
    # 待 Web UI 按会话自主掌握该选择后，移除这个环境变量接缝。
    mode: !!js process.env.DSH_TOOLS_MODE

# ── 仅 Web 需要的宿主行、传输层与浏览器清单 ────────────────────────────────

# `dsh.client` 行是浏览器插件清单，由 modules 的 node 半部分扫描进
# window.__DSH_BOOT__；modules 行同时也是一个宿主行。
- insert:
    - id: desktop-product-telemetry
      name: '@deepseek-ai/dsh-host-product-telemetry-otel'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"
      config:
        scheduledDelayMillis: 30000
        timeoutMillis: 15000
        exportTimeoutMillis: 20000
        shutdownTimeoutMillis: 2000
        serviceName: deepseek-harness-desktop
        serviceVersion: !!js process.env.DSH_CLIENT_VERSION
        endpoint: !!js process.env.DSH_PRODUCT_ANALYTICS_OTLP_URL

    - id: product-analytics
      name: '@deepseek-ai/dsh-client-product-analytics'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"
      config:
        enabled: true
        appVersion: !!js process.env.DSH_CLIENT_VERSION

    # 由宿主持有的可选启用项，在新的 Web 会话获得其 preset 委派工具时被采样。
    # Plugins 页面编辑这个设置命名空间。
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    # 浏览器端的 Session 导出：`/export` 命令加上共享的下载对话框。
    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    # Session 头部的“用…打开”分体按钮，构建在宿主应用的解析之上（macOS/Windows/
    # Linux；没有解析出应用的宿主不渲染该按钮）。它由两半组成：宿主路由与浏览器界面。
    - id: open-in-app
      name: '@deepseek-ai/dsh-host-open-in-app'
      config:
        probeTimeoutMs: 10000
        iconTimeoutMs: 10000
        launchWatchMs: 1000

    - id: ui-open-in-app
      name: '@deepseek-ai/dsh-client-ui-open-in-app'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    # 整份日志的轮次/步骤计数，用于聊天统计条（sessionStats 投影键）；投影注册表本身
    # 属于 base 层的行。
    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # 整份日志的轮次大纲，用于聊天的轮次导航栏（turnOutline 投影键）：每个轮次在其
    # 事件分页加载之前都可导航。
    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    # 在启动时一次性解析绑定主机、SSH 启动与显示环境，然后挂载匹配的双面目录选择器。
    # 可在覆盖层中直接挂载 -native 或 -browse 以固定交互方式。
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-auto'

    # 当前 Loader 条目的只读投影，供受信任的客户端 RPC 使用。
    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    # 通过 Typert Remote 提供的 Session 命令、冷读取与实时控制。
    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    # 一条后台任务的观察记录，通过 Typert Remote 流式传输；任务清单搭载在上面的
    # session 控制流上。
    - id: job-controller
      name: '@deepseek-ai/dsh-api-job-controller'
    # Workspace 文件服务：有界读取、目录列举，以及 session workspace 根目录内由 agent
    # 写入产生的变更流。
    - id: terminal-controller
      name: '@deepseek-ai/dsh-api-terminal-controller'
    - id: workspace-files
      name: '@deepseek-ai/dsh-api-workspace-files'

    # Schedule 服务持有任务存储，并把每个到期的发生次数作为 follow-up 投递到它原有的
    # Session 中。时钟读取与四个提醒工具属于 `standard`、`cordis` 与 `ptc` 三个 preset，
    # 它们在各自的作用域内声明。
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # 通过 Typert Remote 对配置界面进行读写。当对应的设置领域提供者缺失时，每个方法
    # 都报告一个可操作的错误。
    - id: ui-settings-account
      name: '@deepseek-ai/dsh-client-ui-settings-account'

    - id: account-controller
      name: '@deepseek-ai/dsh-api-account-controller'

    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    # 通过 Typert Remote 提供的 Workspace 命令与可安全重连的投影。
    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    # 宿主的 inspect 提供者是进程全局的：注册表会拒绝重复的 id，因此它们在这里注册
    # 一次，各个 preset 的 `tool-cordis` 行读取它们。
    - id: cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'

    # 解析 Web 标志的普通提供者。它插件级的注入等待 cmdlineArgs；不需要任何启动器
    # 元数据或特殊的行类型。
    - id: web-startup
      name: '@deepseek-ai/dsh-web-app/startup'

    # ── 第二层：传输/服务 ───────────────────────────────────────────────────────

    # 纯粹的路由注册载体；主机与端口来自应用的 webStartup 提供者，这里给出部署回退值。
    # dist 由下面的 web-runtime 行通过兜底座位提供服务。路由与面向浏览器的资源路径
    # 不依赖所宣告的 URL（那归 web-runtime 行所有）；Connection 从 webStartup 读取
    # 信任的 authority 列表。本行拒绝通配绑定。
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        tls: !!js ctx.webStartup.tls
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    # 本 bundle 所拥有的 Web 粘合层：解析已构建的前端 dist（这是 dsh-web-app 的装配
    # 事实，绝不由用户配置），挂载 frontend-static 兜底所有者，注册 bash 运行时变量，
    # 打印 URL 行，并在完整 Loader 树装配完成、必需条目审计通过之后打开规范的 URL。
    # 仅与本次调用有关的取值来自 webStartup 提供者；所宣告的应用 URL 是本行的
    # `publicUrl`，否则使用绑定地址的 URL。
    - id: web-runtime
      name: '@deepseek-ai/dsh-web-app'
      inject: [webStartup]
      config:
        openBrowser: !!js ctx.webStartup.openBrowser
        printUrl: true
        publicUrl: !!js ctx.webStartup.publicUrl
        surfaceContext: true

    # 为检查或扩展本 GUI 所属 harness 的 agent 提供的模型上下文：不带取值的提示词段落，
    # 加上当前检出目录与 GUI URL 作为可选的运行时上下文。完整的 agent-preset 人格会
    # 替换这些段落，而抑制可选运行时上下文的人格也会去掉这两行取值。
    - id: harness-dev-context
      name: '@deepseek-ai/dsh-harness-dev-context'

    # 客户端插件重载链，始终挂载：在重建监视器（pnpm run dev:web）真正重写客户端包之前
    # 它处于空闲状态。它是一个独立的行而不是 web-runtime 的子行，因为它的 node 半部分是
    # 一个客户端侧的包，而宿主侧的 bundle 无法导入它。
    - id: client-hmr
      name: '@deepseek-ai/dsh-client-hmr'

    # ── 浏览器插件清单（dsh.client 行；其 node 半部分属于第二层宿主）────────────

    # 双面：node 半部分扫描这棵树、组装 window.__DSH_BOOT__，并服务
    # /plugins/<id>/client.js；浏览器半部分是外壳内核在 cordis 存在之前构建的模块表
    # （由内核作为插件条目收养，从不被拉取）。
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    # 拥有 Web 传输的两端：node 半部分把 gateway 绑定到 webserver 的 /api 之下；
    # 浏览器半部分是 fetch/SSE 客户端。每个 API 请求与协议升级都要通过回环、监听器绑定
    # 或 trustedHosts 策略；所宣告的公开 URL 对此不产生任何作用。
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [webStartup]
      config:
        # 在补充部署取值时要保留本次调用的 authority（每个 --trusted-host 值），
        # 例如：['app.internal', ...ctx.webStartup.trustedHosts]。
        # 监听器的绑定 IP 独立于该列表另行接受。
        trustedHosts: !!js ctx.webStartup.trustedHosts

    # 原始 Blob 与 ReadableStream 上传独立于 Connection 的 RPC 与生成服务运行。
    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: shortcuts
      name: '@deepseek-ai/dsh-client-shortcuts'

    - id: ui-shortcuts
      name: '@deepseek-ai/dsh-client-ui-shortcuts'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'

    # 统一的资源模型：位于 useResource hook 之后的各协议提供者。
    - id: resources
      name: '@deepseek-ai/dsh-client-resources'

    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'

    # 右侧边栏：在每个 session 之上，基于 ui-dockkit 提供一个停靠界面。
    - id: ui-sidebar-right
      name: '@deepseek-ai/dsh-client-ui-sidebar-right'


    - id: office-to-pdf
      name: '@deepseek-ai/dsh-office-to-pdf'

    # 右侧边栏的文档标签页：有界的文件读取，并可选择 Markdown、代码、HTML、PDF、
    # Office 与纯文本的渲染器。
    - id: ui-sidebar-documentpreview
      name: '@deepseek-ai/dsh-client-ui-sidebar-documentpreview'

    # Web profile 选择启用；Desktop 仍保留沙箱化的 HTTP(S) 浏览器标签页。
    - id: ui-sidebar-browser
      name: '@deepseek-ai/dsh-client-ui-sidebar-browser'
      disabled: !!js "ctx.get('profileContext')?.name !== 'desktop'"

    - id: ui-sidebar-terminal
      name: '@deepseek-ai/dsh-client-ui-sidebar-terminal'
    # 右侧边栏中的 workspace 文件树标签页类型。
    - id: ui-sidebar-files
      name: '@deepseek-ai/dsh-client-ui-sidebar-files'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    - id: ui-settings-models
      name: '@deepseek-ai/dsh-client-ui-settings-models'

    # 插件管理：侧边栏的 Plugins 页面通过 `pluginManager` Remote 安装、启用、禁用与
    # 移除该 profile 的各个 bundle。没有 profile 支撑的 Host 时，它报告自身不可用。
    - id: ui-plugin-manager
      name: '@deepseek-ai/dsh-client-ui-plugin-manager'

    # 设置中 Plugins 区块内的只读插件列表标签页；侧边栏页面未涵盖的内置 bundle 在这里
    # 被查看。
    - id: ui-settings-plugin-inventory
      name: '@deepseek-ai/dsh-client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    - id: ui-approval
      name: '@deepseek-ai/dsh-client-ui-approval'

    - id: ui-chat
      name: '@deepseek-ai/dsh-client-ui-chat'

    # 通用侧边栏与会话品牌位的官方占用者。
    - id: ui-brand-official
      name: '@deepseek-ai/dsh-client-ui-brand-official'

    - id: ui-attachment
      name: '@deepseek-ai/dsh-client-ui-attachment'

    # 工具调用树、通用兜底渲染，以及按 key 区分的业务 Tool 视图。
    - id: ui-tool
      name: '@deepseek-ai/dsh-client-ui-tool'

    - id: ui-cordis
      name: '@deepseek-ai/dsh-client-ui-cordis'

    # 轮次尾部：每条收尾 assistant 消息之下的变更文件卡片与投递卡片。移除该条目即可
    # 关闭该界面；尾部占位会渲染为空。
    - id: ui-deliverables
      name: '@deepseek-ai/dsh-client-ui-deliverables'

    # 依据 git 工作区快照记录每个顶层轮次变更的文件；上面的变更文件卡片渲染它的事件。
    - id: workspace-changes
      name: '@deepseek-ai/dsh-workspace-changes'


    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'

    # 紧随既有的通用 workflow 工具行之后，作为独立 Chat 节点的持久化 workflow 生命周期。
    - id: ui-workflow-run
      name: '@deepseek-ai/dsh-client-ui-workflow-run'

    # 输入触发器：'/' | '@' 的管线（ui-input-trigger）、构建在其上的命令界面
    # （ui-commands），以及引用来源（ui-skill / ui-reference）。
    - id: ui-input-trigger
      name: '@deepseek-ai/dsh-client-ui-input-trigger'

    - id: ui-commands
      name: '@deepseek-ai/dsh-client-ui-commands'

    - id: ui-skill
      name: '@deepseek-ai/dsh-client-ui-skill'

    - id: ui-subagent
      name: '@deepseek-ai/dsh-client-ui-subagent'

    - id: ui-reference
      name: '@deepseek-ai/dsh-client-ui-reference'

    # 对已发送用户文本中已识别凭据的展示掩码；移除该条目即可让凭据按原文绘制。
    - id: ui-secret-mask
      name: '@deepseek-ai/dsh-client-ui-secret-mask'

    # 后台任务：session 头部的任务清单，加上面向任务的按需流式记录面板，运行于
    # session job-output 服务之上。
    - id: ui-jobs
      name: '@deepseek-ai/dsh-client-ui-jobs'

    # 任务管理与 Session 提醒目录，运行于上面挂载的 Host Schedule 服务之上。
    - id: ui-schedule
      name: '@deepseek-ai/dsh-client-ui-schedule'

    # 目标界面：位于输入坞的 GoalBar，构建在 goal 会话投影之上。
    - id: ui-goal
      name: '@deepseek-ai/dsh-client-ui-goal'

    # 反馈界面：位于 assistant 消息操作条的 Like/Dislike，Dislike 与 /feedback 之下的反馈
    # 对话框及其确认提示，运行于 messageFeedback 与 sessionFeedback Remotes 之上。
    - id: ui-message-feedback
      name: '@deepseek-ai/dsh-client-ui-message-feedback'

    # 模型选择：基于 session.models 的 /model popupSelect 与编辑器座位。
    - id: ui-model-selection
      name: '@deepseek-ai/dsh-client-ui-model-selection'

    - id: ui-deepseek-model-label-1017
      name: '@deepseek-ai/dsh-client-ui-deepseek-model-label-1017'

    - id: ui-permission
      name: '@deepseek-ai/dsh-client-ui-permission-presets'

    # General 设置中的 agent-preset 行：稍后新建会话时使用的默认 preset。若没有
    # preset 名单则不渲染任何内容。
    - id: ui-agent-preset
      name: '@deepseek-ai/dsh-client-ui-agent-preset'

    - id: ui-settings-session-log
      name: '@deepseek-ai/dsh-client-ui-settings-session-log'

    # 内置插件设置区块：导航条目以及清单标签页要注册到的那一行。官方的配置页面在下方
# 对应的各行中。
    - id: ui-settings-plugins
      name: '@deepseek-ai/dsh-client-ui-settings-plugins'

    # 官方的设置页面：每个宿主层命名空间对应一个 companion 包，它们在 Host 服务
    # 该命名空间的同时把自己的页面注册到 Plugins 页面里。
    - id: ui-settings-shell
      name: '@deepseek-ai/dsh-client-ui-settings-shell'

    - id: ui-settings-agent-loop
      name: '@deepseek-ai/dsh-client-ui-settings-agent-loop'

    - id: ui-settings-subagent
      name: '@deepseek-ai/dsh-client-ui-settings-subagent'

    - id: ui-settings-web-search
      name: '@deepseek-ai/dsh-client-ui-settings-web-search'

    # 计划控制：覆盖 plan 投影与 /plan 通道的编辑器 plan 座位。
    - id: ui-plan
      name: '@deepseek-ai/dsh-client-ui-plan'

    - id: ui-user-questions
      name: '@deepseek-ai/dsh-client-ui-user-questions'

    - id: ui-trajectory
      name: '@deepseek-ai/dsh-client-ui-trajectory'

# ── agent 层迁移到 agent preset 之后 ────────────────────────────────────────
#
# 下面每一行组装的是一个 agent 贡献给宿主注册表的内容：它的工具、提示词段落、委派后端。
# base 仍为 TUI 保留它们——TUI 是单会话的，在进程范围内组装它的 agent；Web 界面在这里
# 把它们停用，让每个 session 改为挂载一个 preset。
#
# 用停用而非删除是有意为之：base 是共享的，而一行若从某个界面覆盖层中缺席，将来一旦
# 有人重新调整组装顺序，它就会悄悄回潮。

# `shell-env` 留在宿主层：`apps/cli/src/web.ts` 注入它以发布 `DSH_WEB_URL` /
# `DSH_WEB_MODE`，而宿主行注入了某个服务就是它属于宿主层的判据——注入在任何 session
# 存在之前就解析了，因此没有 agent 可以作为区分键。藏在 preset 后面之后，这些变量
# 根本不会到达模型的外壳。

- id: tool-plugin-manager
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# 后台任务的 REGISTRY 留在宿主层；只有面向模型的 `job_*` 控制项随之迁移。它的生产者
# ——本处的 `tool-bash` 与他处的 `tool-terminal`——是 preset 中的各行，借助 `ctx.get`
# 解析它，而在该注册表周围建立 entry-local realm 会让它对该 realm 之外的每条兄弟行不可见，
# 因此 `run_in_background` 在控制项已经存在于目录中时仍会回答“后台任务不可用”。那正是
# 从 preset 内部读到的 `goals` 判据：realm 外某行 READ 的某个 Service 属于两者都能看到的层。
# 注册表按所属 agent 索引，因此一个宿主实例会和 preset 之前一样为每个 session 服务。

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

# `skill` 的 REGISTRY 留在宿主层。它是“宿主 + 每作用域”分层（与 tools-registry 同形）：
# 部署级提供者——仓库插件、宿主 skill-filesystem 行——注册进它的全局层，而 preset 中的
# `skill-filesystem` 注册进该 preset 的层，每个 agent 读取其作用域链所选中的合并后目录。
# 只有 per-agent 的行迁移到 preset 之后：base 的宿主 `skill-filesystem` 行在此停用
# （本地发现由 preset 负责），而 `tool-skill` 是 preset 挂载来给其 agent 提供目录与
# 加载器的行。

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# goal 服务与会话驱动器留在宿主层，由 Gateway 远程来解析它们。preset 持有对应的人工
# 命令与面向模型工具。

- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

# token METER 留在宿主层；只有读取它的压缩后端随之迁移。它持有 context-meter 的投影单元，
# 而该表是进程范围的，因此如果交给 preset 拥有，meter 就会变成“恰好挂载了哪些 preset”
# 的函数，而不再是每会话一个事实。与 `tasks`、`goals` 采用同一判据；其推理在
# `.agents/notes/implemented/architecture/2026-08-10-host-plane-ownership-after-presets.md`
# 中只有一处归宿。

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# subagent 注册表与它的各个后端都留在宿主层。`subagents` 是一个进程单例，并通过跨会话的
# 查询面（`listChildren`、`followup`）由宿主 api-proxy 提供给浏览器，而 provider 以全局
# 唯一的名字注册，因此做一个 per-session 副本既会让那个宿主行挨饿，又会在第二个 session
# 上发生名字冲突。preset 选择的是下面这一组——其 agent 看到的具体委派 TOOLS。

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

# preset 选择注册表。已发布的 preset 声明紧随其后，单独以 `presets/` 目录下的各补丁
# 文件形式出现，并在 `package.json` 的 `dsh.bundle.patch` 字段中按顺序列出。
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard
