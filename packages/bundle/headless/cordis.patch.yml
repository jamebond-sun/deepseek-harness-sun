# dsh-headless bundle 补丁：直接构建在 dsh-base 之上的一次性任务模式。它不挂载任何
# Host、HTTP 服务器、Web runtime 或浏览器插件。一个普通的提供者插件注入 `cmdlineArgs`，
# 解析 task 位置参数（`dsh --profile headless "<task>"`）、`--session-id` 与 `--json`
# 选项以及本应用的 --help，随后直接驱动器通过核心注册表创建一个新的 Agent，或沿用该
# 标志所指名的确切 Session，并打印其持久化结果。

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    # 与 Web 界面一样，保留这个临时的进程级 PTC 模式开关。
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    # 从普通的 headlessStartup 提供者读取其任务与运行选项。
    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionId: !!js ctx.headlessStartup.sessionId
        json: !!js ctx.headlessStartup.json

- id: hmr
  disabled: true

# 一次性任务使用启动时的凭据，而不是交互式凭据存储。
- id: credentials
  disabled: true

- id: authorization
  disabled: true

- id: deepseek-account
  disabled: true
